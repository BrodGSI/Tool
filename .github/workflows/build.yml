name: Build and Release BrodGSI (x64 & ARM64)

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-native:
    name: Build ${{ matrix.platform_name }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.allow_fail || false }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Windows x64
          - os: windows-latest
            platform_name: Windows
            arch: x64
            artifact_name: brodgsi-windows-x64
            archive_ext: zip

          # Windows ARM64
          - os: windows-11-arm
            platform_name: Windows
            arch: arm64
            artifact_name: brodgsi-windows-arm64
            archive_ext: zip
            allow_fail: true

          # Linux x64
          - os: ubuntu-latest
            platform_name: Linux
            arch: x64
            artifact_name: brodgsi-linux-x64
            archive_ext: tar.gz

          # macOS x64 (Intel)
          - os: macos-13
            platform_name: macOS
            arch: x64
            artifact_name: brodgsi-macos-x64
            archive_ext: tar.gz
            allow_fail: true

          # macOS ARM64 (Apple Silicon)
          - os: macos-latest
            platform_name: macOS
            arch: arm64
            artifact_name: brodgsi-macos-arm64
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libarchive-tools default-jre-headless aria2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller pillow

      - name: Build Standalone Executables
        run: |
          python build_binaries.py

      - name: Package Release Archives
        run: |
          python scripts/package.py --name ${{ matrix.artifact_name }}-standalone --format ${{ matrix.archive_ext }}
          python scripts/package.py --name ${{ matrix.artifact_name }} --format ${{ matrix.archive_ext }} --include-patches

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
            ${{ matrix.artifact_name }}-standalone.${{ matrix.archive_ext }}
          retention-days: 14

  build-linux-arm64:
    name: Build Linux (arm64 via QEMU)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for ARM64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: linux/arm64

      - name: Build inside Linux ARM64 Container
        run: |
          docker run --rm --platform linux/arm64 \
            -v "$GITHUB_WORKSPACE:/workspace" \
            -w /workspace \
            python:3.11-bookworm \
            bash -c "
              apt-get update && \
              apt-get install -y python3-tk libarchive-tools aria2 default-jre-headless build-essential && \
              pip install --upgrade pip && \
              pip install -r requirements.txt pyinstaller pillow && \
              python build_binaries.py && \
              python scripts/package.py --name brodgsi-linux-arm64-standalone --format tar.gz && \
              python scripts/package.py --name brodgsi-linux-arm64 --format tar.gz --include-patches
            "

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: brodgsi-linux-arm64
          path: |
            brodgsi-linux-arm64.tar.gz
            brodgsi-linux-arm64-standalone.tar.gz
          retention-days: 14

  release:
    name: Publish to GitHub Releases
    needs: [build-native, build-linux-arm64]
    if: always() && !cancelled() && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: raw-artifacts

      - name: Flatten and verify release assets
        id: prep
        run: |
          mkdir -p release-files
          find raw-artifacts -type f \( -name "*.zip" -o -name "*.tar.gz" \) -exec cp -fv {} release-files/ \;
          echo "=== Collected release archives ==="
          ls -lh release-files/
          total_files=$(ls -1 release-files/ | wc -l)
          echo "Total files: $total_files"
          if [ "$total_files" -eq 0 ]; then
            echo "::error::No build archives found to upload!"
            exit 1
          fi

      - name: Set Release Variables
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=Release ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=continuous" >> "$GITHUB_OUTPUT"
            echo "release_name=Continuous Build (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.vars.outputs.release_name }}
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-files/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
