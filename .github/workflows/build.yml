name: Build and Release BrodGSI

on:
  push:
    branches: [ "**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: brodgsi-windows-x86_64
            archive_ext: zip
          - os: ubuntu-latest
            artifact_name: brodgsi-linux-x86_64
            archive_ext: tar.gz
          - os: macos-latest
            artifact_name: brodgsi-macos
            archive_ext: tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libarchive-tools default-jre-headless aria2

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Build Standalone Executables
        run: |
          python build_binaries.py

      - name: Prepare Windows Archive
        if: runner.os == 'Windows'
        run: |
          mkdir package
          copy dist\brodgsi-gui.exe package\
          copy dist\brodgsi-cli.exe package\
          copy README.md package\
          copy LICENSE package\
          powershell Compress-Archive -Path package\* -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Prepare Unix Archive (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir package
          chmod +x dist/brodgsi-gui dist/brodgsi-cli
          cp dist/brodgsi-gui dist/brodgsi-cli README.md LICENSE package/
          tar -czvf ${{ matrix.artifact_name }}.tar.gz -C package .

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          retention-days: 14

  release:
    name: Publish to GitHub Releases
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Set Release Variables
        id: vars
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag_name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "release_name=Release ${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=continuous" >> "$GITHUB_OUTPUT"
            echo "release_name=Continuous Build (${GITHUB_SHA::7})" >> "$GITHUB_OUTPUT"
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: ${{ steps.vars.outputs.release_name }}
          prerelease: ${{ steps.vars.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
